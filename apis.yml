aid: heal
name: Heal
description: 'Heal (legally Get Heal, Inc.) was a Los Angeles based in-home primary
  care practice founded in 2014 that delivered on-demand doctor house calls, one-touch
  telemedicine, telepsychology and remote patient monitoring, aimed largely at Medicare
  Advantage members. Humana took a $100M stake in the company in July 2020 and then
  acquired it outright, folding the practice into its CenterWell primary care brand.
  Heal never ran a public developer program: it published no OpenAPI, no developer
  portal and no SDKs. As of this profile heal.com issues a 301 redirect to centerwell.com
  for every path, and the one surviving technical host, api.heal.com, answers every
  request with a blanket HTTP 401.'
